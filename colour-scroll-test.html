<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colour animation test</title>
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #f3ece0; color: #2b2622; }
    .spacer { height: 80vh; display: grid; place-items: center; font-size: 1.3rem; opacity: .6; }
    section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 8vw; }
    h2 { font-weight: normal; margin: 0 0 .3rem; }
    p.note { margin: 0 0 1.5rem; opacity: .6; font-size: .95rem; }
    .frame { position: relative; width: min(80vw, 900px); aspect-ratio: 14 / 9; overflow: hidden; }
    .frame img, .frame svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .sketch { filter: grayscale(1) contrast(1.3) brightness(1.1); }
  </style>
</head>
<body>
  <div class="spacer">Scroll down ↓</div>

  <!-- A · Painted in with brush strokes (SVG mask + DrawSVG), pinned while it paints -->
  <section class="brush-section">
    <h2>A · Painted in with brush strokes</h2>
    <p class="note">The section stays pinned while one big brush stroke paints the colour from top to bottom.</p>
    <div class="frame">
      <svg viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice">
        <defs>
          <!-- Makes the brush edges rough instead of perfectly smooth -->
          <!-- userSpaceOnUse: the filter area is set in pixels, so it covers the whole giant stroke -->
          <filter id="rough" filterUnits="userSpaceOnUse" x="-400" y="-1200" width="2200" height="3400">
            <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="4"/>
            <feDisplacementMap in="SourceGraphic" scale="140"/>
          </filter>
          <!-- White = visible. One giant brush, wider than the image (1400), sweeping from top to bottom. -->
          <mask id="paint">
            <g filter="url(#rough)" fill="none" stroke="white" stroke-width="1800" stroke-linecap="round">
              <!-- Starts above the image so the round brush tip is hidden at the start -->
              <path class="stroke" d="M700,-950 C640,-100 780,450 700,1000"/>
            </g>
          </mask>
        </defs>
        <image class="sketch" href="https://picsum.photos/id/292/1400/900" width="1400" height="900" preserveAspectRatio="xMidYMid slice"/>
        <image href="https://picsum.photos/id/292/1400/900" width="1400" height="900" preserveAspectRatio="xMidYMid slice" mask="url(#paint)"/>
      </svg>
    </div>
  </section>

  <div class="spacer">Keep scrolling ↓</div>

  <!-- B · A circle of colour spreading out, played once (not scrubbed) -->
  <section class="circle-section">
    <h2>B · Colour spreading from one point</h2>
    <p class="note">This one plays as a real animation once it's in view, and reverses when you scroll back up.</p>
    <div class="frame">
      <img class="sketch" src="https://picsum.photos/id/292/1400/900" alt="">
      <img class="circle-colour" src="https://picsum.photos/id/292/1400/900" alt="Test photo">
    </div>
  </section>

  <div class="spacer">The end</div>

  <!-- CDN for quick testing; use your /lib files in the project -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/DrawSVGPlugin.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger, DrawSVGPlugin);

    // A · one big brush stroke draws itself from top to bottom while pinned
    gsap.set('.stroke', { drawSVG: '0%' });
    gsap.timeline({
      scrollTrigger: {
        trigger: '.brush-section',
        start: 'top top',
        end: '+=150%',     // how much scrolling the painting takes
        pin: true,         // the section stays on screen while it paints
        scrub: 1           // follows the scroll with a little smoothing
      }
    })
    .to('.stroke', { drawSVG: '100%', ease: 'power1.inOut', duration: 1 });

    // B · circle grows from a point while the image settles from a slight zoom
    gsap.timeline({
      scrollTrigger: {
        trigger: '.circle-section',
        start: 'top 40%',
        toggleActions: 'play none none reverse'   // play on enter, reverse when scrolling back above it
      }
    })
    .fromTo('.circle-colour',
      { clipPath: 'circle(0% at 35% 60%)', scale: 1.15 },
      { clipPath: 'circle(80% at 50% 50%)', scale: 1, duration: 2.2, ease: 'power3.inOut' });
  </script>
</body>
</html>
