<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colour on scroll test</title>
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #f3ece0; color: #2b2622; }
    .spacer { height: 100vh; display: grid; place-items: center; font-size: 1.4rem; opacity: .6; }
    section { padding: 10vh 10vw; }
    h2 { font-weight: normal; margin-bottom: 1rem; }

    /* Test 1: one image, grayscale scrubbed away */
    .memory-img { display: block; width: 100%; max-width: 700px; }

    /* Test 2: two images stacked, the colour one revealed with clip-path */
    .img-wrap { position: relative; width: 100%; max-width: 700px; }
    .img-wrap img { display: block; width: 100%; }
    .img-colour { position: absolute; inset: 0; clip-path: inset(0 100% 0 0); }
  </style>
</head>
<body>
  <div class="spacer">Scroll down ↓</div>

  <section>
    <h2>Test 1 · Grayscale → colour</h2>
    <!-- Swap the src for your own photo, e.g. images/mom-kitchen.jpg -->
    <img class="memory-img" src="https://picsum.photos/id/292/1400/900" alt="Test photo">
  </section>

  <div class="spacer">Keep scrolling ↓</div>

  <section>
    <h2>Test 2 · Sketch → colour (wipe)</h2>
    <div class="img-wrap">
      <!-- Bottom: the grey/sketch version. Top: the colour version. Use the same size images. -->
      <img class="img-sketch" src="https://picsum.photos/id/292/1400/900?grayscale" alt="">
      <img class="img-colour" src="https://picsum.photos/id/292/1400/900" alt="Test photo">
    </div>
  </section>

  <div class="spacer">The end</div>

  <!-- For quick testing GSAP comes from a CDN; in your project use your own /lib files -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    // Test 1
    gsap.fromTo('.memory-img',
      { filter: 'grayscale(1) brightness(0.9)' },
      { filter: 'grayscale(0) brightness(1)',
        ease: 'none',
        scrollTrigger: {
          trigger: '.memory-img',
          start: 'top 80%',      // starts when the top of the image hits 80% of the screen
          end: 'center center',  // finished when the image is in the middle
          scrub: true,           // tied to the scroll position, also works backwards
          markers: true          // shows start/end lines while testing; remove later
        }
      });

    // Test 2
    gsap.to('.img-colour', {
      clipPath: 'inset(0 0% 0 0)',
      ease: 'none',
      scrollTrigger: {
        trigger: '.img-wrap',
        start: 'top 80%',
        end: 'center center',
        scrub: true,
        markers: true
      }
    });
  </script>
</body>
</html>
